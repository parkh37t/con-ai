name: Deploy to GitHub Pages

# con-ai 워크벤치를 GitHub Pages로 배포한다 (S2B 프로토타입 방식).
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트 전체를 정적 사이트로 업로드 (index.html + projects/*)
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
