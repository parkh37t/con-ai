<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>와일리 OS 통합 핸드북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 원본(SSOT) = 10_WYLIE-OS-HANDBOOK.md · 이 페이지는 렌더 뷰어 */
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#0f172a; --txt:#293548; --muted:#64748b;
  --line:#e2e8f0; --soft:#f8fafc; --gold:#b8860b; --gold-line:#e3c878;
  --code-bg:#f1f5f9; --th-bg:#0f172a; --th-tx:#e8edf4; --link:#1d4ed8; --hero:#0f172a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --card:#111827; --ink:#f1f5f9; --txt:#cbd5e1; --muted:#94a3b8;
    --line:#1f2937; --soft:#0f172a; --gold:#e3c878; --gold-line:#a8862b;
    --code-bg:#1e293b; --th-bg:#1e293b; --th-tx:#e2e8f0; --link:#93c5fd; --hero:#020617;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --card:#111827; --ink:#f1f5f9; --txt:#cbd5e1; --muted:#94a3b8;
  --line:#1f2937; --soft:#0f172a; --gold:#e3c878; --gold-line:#a8862b;
  --code-bg:#1e293b; --th-bg:#1e293b; --th-tx:#e2e8f0; --link:#93c5fd; --hero:#020617;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(135deg,var(--hero),#1e293b);color:#fff;border-top:3px solid var(--gold-line)}
.hero-in{max-width:1240px;margin:0 auto;padding:26px 16px}
.hero h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero p{margin:0;color:#cbd5e1;font-size:13px}
.hero .acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .acts a,.hero .acts button{font:inherit;font-size:12px;color:#f8e7b4;border:1px solid rgba(227,200,120,.45);background:rgba(227,200,120,.12);padding:4px 11px;border-radius:7px;text-decoration:none;cursor:pointer}
.layout{max-width:1240px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px}
nav.toc{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;font-size:12.5px}
nav.toc b{display:block;color:var(--ink);margin:0 0 8px 4px}
nav.toc a{display:block;padding:4px 6px;border-radius:6px;color:var(--muted);text-decoration:none;line-height:1.45}
nav.toc a:hover,nav.toc a.on{background:var(--soft);color:var(--ink)}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 32px;min-width:0}
article h1{display:none}
article h2{font-size:19px;font-weight:800;color:var(--ink);margin:38px 0 12px;padding:0 0 9px 12px;border-bottom:1px solid var(--line);position:relative;scroll-margin-top:16px}
article h2::before{content:"";position:absolute;left:0;top:4px;width:4px;height:19px;border-radius:3px;background:var(--gold)}
article h2:first-of-type{margin-top:6px}
article h3{font-size:15.5px;font-weight:700;color:var(--ink);margin:24px 0 8px;scroll-margin-top:16px}
article p,article li{color:var(--txt)}
article a{color:var(--link)}
article blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--gold-line);background:var(--soft);border-radius:0 8px 8px 0;color:var(--txt)}
article blockquote p{margin:4px 0}
article hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.tbl{overflow-x:auto;margin:12px 0}
article table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
article th{background:var(--th-bg);color:var(--th-tx);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap}
article td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
article tbody tr:nth-child(even) td{background:var(--soft)}
article code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;background:var(--code-bg);padding:1px 5px;border-radius:4px;color:var(--ink)}
article pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;line-height:1.55}
article pre code{background:none;padding:0;font-size:12px}
article pre.mermaid{background:var(--soft);text-align:center}
article pre.mermaid svg{max-width:100%;height:auto}
article p code,article li code,article td code{overflow-wrap:anywhere}
.status{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:static;max-height:none}
  article{padding:20px 16px}
}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <h1>와일리 OS 통합 핸드북</h1>
  <p>학습·이식·재개발용 단일 문서 — 원본은 <code style="background:rgba(255,255,255,.1);color:#f8e7b4">10_WYLIE-OS-HANDBOOK.md</code>, 이 페이지는 그 렌더 뷰어입니다.</p>
  <div class="acts">
    <a href="10_WYLIE-OS-HANDBOOK.md" download>MD 원문 받기</a>
    <a href="../../index.html">워크벤치 홈</a>
    <button type="button" id="theme-btn">화면 모드 전환</button>
  </div>
</div></header>

<div class="layout">
  <nav class="toc" id="toc"><b>목차</b></nav>
  <article id="doc"><div class="status">문서를 불러오는 중…</div></article>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.esm.min.mjs';

const root = document.documentElement;
try { const t = localStorage.getItem('wylie-handbook-theme'); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById('theme-btn').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('wylie-handbook-theme', root.dataset.theme); } catch (e) {}
  location.reload();
});

/* GitHub 방식 앵커: 소문자 → 문자·숫자·공백·하이픈만 남김 → 공백마다 하이픈 */
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{M}\p{N}\p{Pc}\s-]/gu, '').replace(/\s/g, '-');

const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

async function main(){
  const doc = document.getElementById('doc');
  let md;
  try {
    const res = await fetch('10_WYLIE-OS-HANDBOOK.md', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch (e) {
    doc.innerHTML = '<div class="status">문서를 불러오지 못했습니다. 로컬 http 서버 또는 GitHub Pages 주소로 열어 주십시오(file:// 불가).</div>';
    return;
  }
  doc.innerHTML = marked.parse(md);

  // 표 가로 스크롤 래핑
  doc.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });

  // 본문 안 "목차" 절은 사이드 목차와 중복 → 뷰어에서만 숨김(MD 원문엔 유지)
  doc.querySelectorAll('h2').forEach(h => {
    if (h.textContent.trim() !== '목차') return;
    const list = h.nextElementSibling, rule = list && list.nextElementSibling;
    if (rule && rule.tagName === 'HR') rule.remove();
    if (list && list.tagName === 'OL') list.remove();
    h.remove();
  });

  // 제목 앵커 + 목차
  const toc = document.getElementById('toc');
  doc.querySelectorAll('h2, h3').forEach(h => {
    h.id = slug(h.textContent);
    if (h.tagName === 'H2') {
      const a = document.createElement('a');
      a.href = '#' + h.id; a.textContent = h.textContent;
      toc.appendChild(a);
    }
  });

  // mermaid 코드 블록 → 다이어그램
  doc.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad:false, securityLevel:'loose', theme: isDark() ? 'dark' : 'base',
    themeVariables:{ fontSize:'12px', fontFamily:"'Noto Sans KR',sans-serif" },
    flowchart:{ htmlLabels:true, curve:'basis', nodeSpacing:26, rankSpacing:30 } });
  await mermaid.run({ querySelector: 'pre.mermaid' });

  // 해시로 진입 시 위치 복원
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }

  // 현재 절 하이라이트
  const links = [...toc.querySelectorAll('a')];
  const obs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id)); });
  }, { rootMargin: '0px 0px -75% 0px' });
  doc.querySelectorAll('h2').forEach(h => obs.observe(h));
}
main();
</script>
</body>
</html>
